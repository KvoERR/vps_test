<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сервис бронирований</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <div class="container">
        <!-- Заголовок -->
        <h1>🏨 Сервис бронирований</h1>
        <p class="subtitle">Создавайте бронирования, вносите платежи и управляйте статусами</p>

        <!-- Карточка создания -->
        <div class="create-card">
            <label for="costInput">Стоимость бронирования</label>
            <input
                type="number"
                id="costInput"
                placeholder="Например: 1000"
                min="0.01"
                step="0.01"
            />
            <button class="btn btn-primary" id="createBtn">
                ✨ Создать
            </button>
        </div>

        <!-- Список бронирований -->
        <div id="bookingsContainer">
            <div class="loading">Загрузка...</div>
        </div>
    </div>

    <!-- Уведомление (тост) -->
    <div id="toast" class="toast"></div>

    <script src="/static/script.js"></script>
</body>
</html>
